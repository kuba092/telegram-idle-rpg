<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Idle RPG</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #27365c 0%, #111827 45%, #070b14 100%);
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px;
    }

    .top-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 14px;
    }

    .stat {
      padding: 11px 7px;
      text-align: center;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 15px;
    }

    .stat-label {
      display: block;
      margin-bottom: 5px;
      font-size: 11px;
      color: #aab3c5;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
    }

    .battle-card {
      padding: 20px 16px;
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
    }

    .stage {
      display: inline-block;
      margin-bottom: 14px;
      padding: 7px 12px;
      font-size: 13px;
      color: #ffd783;
      background: rgba(255, 215, 131, 0.12);
      border-radius: 20px;
    }

    .battle-scene {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .fighter {
      flex: 1;
      padding: 14px 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 18px;
    }

    .fighter-icon {
      min-height: 82px;
      font-size: 66px;
      transition: transform 0.15s;
    }

    .hero-attacking {
      transform: translateX(14px) scale(1.08);
    }

    .enemy-hit {
      transform: translateX(8px) rotate(5deg);
    }

    .fighter-name {
      margin-top: 7px;
      font-weight: bold;
    }

    .versus {
      font-weight: bold;
      color: #8993a8;
    }

    .enemy-panel {
      margin-bottom: 16px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.26);
      border-radius: 18px;
    }

    .enemy-title {
      margin-bottom: 9px;
      font-weight: bold;
    }

    .health-bar {
      height: 15px;
      overflow: hidden;
      background: #3a1620;
      border-radius: 20px;
    }

    .health-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff3f55, #ff8d4d);
      transition: width 0.2s;
    }

    .progress-text {
      margin-top: 9px;
      font-size: 13px;
      color: #aab3c5;
    }

    .character-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .character-stat {
      padding: 10px 5px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 13px;
    }

    .character-stat-label {
      display: block;
      margin-bottom: 4px;
      font-size: 10px;
      color: #aab3c5;
    }

    .character-stat-value {
      font-size: 15px;
      font-weight: bold;
    }

    .battle-status {
      min-height: 46px;
      margin-top: 15px;
      padding: 12px;
      color: #ffd783;
      background: rgba(0, 0, 0, 0.18);
      border-radius: 14px;
    }

    .auto-battle {
      margin-top: 10px;
      font-size: 13px;
      color: #76e6a2;
    }

    .error {
      color: #ff8e9c;
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="top-panel">
      <div class="stat">
        <span class="stat-label">УРОВЕНЬ</span>
        <span class="stat-value" id="level">1</span>
      </div>

      <div class="stat">
        <span class="stat-label">ЗОЛОТО</span>
        <span class="stat-value" id="gold">0</span>
      </div>

      <div class="stat">
        <span class="stat-label">СИЛА</span>
        <span class="stat-value" id="power">10</span>
      </div>
    </section>

    <section class="battle-card">
      <div class="stage">
        Этап <span id="stage">1</span>
      </div>

      <div class="battle-scene">
        <div class="fighter">
          <div class="fighter-icon" id="heroIcon">🧙‍♂️</div>
          <div class="fighter-name" id="heroName">Герой</div>
        </div>

        <div class="versus">VS</div>

        <div class="fighter">
          <div class="fighter-icon" id="enemyIcon">🟢</div>
          <div class="fighter-name">Слизень</div>
        </div>
      </div>

      <div class="enemy-panel">
        <div class="enemy-title">
          HP врага:
          <span id="enemyHp">30</span>/<span id="enemyMaxHp">30</span>
        </div>

        <div class="health-bar">
          <div class="health-fill" id="enemyHpBar"></div>
        </div>

        <div class="progress-text">
          Побеждено на этапе:
          <span id="killsInStage">0</span>/10
        </div>
      </div>

      <div class="character-stats">
        <div class="character-stat">
          <span class="character-stat-label">УРОН</span>
          <span class="character-stat-value" id="damage">10</span>
        </div>

        <div class="character-stat">
          <span class="character-stat-label">СКОРОСТЬ</span>
          <span class="character-stat-value" id="attackSpeed">1.00</span>
        </div>

        <div class="character-stat">
          <span class="character-stat-label">УБИЙСТВА</span>
          <span class="character-stat-value" id="totalKills">0</span>
        </div>
      </div>

      <div class="battle-status" id="message">
        Подключаемся к серверу…
      </div>

      <div class="auto-battle" id="autoBattleStatus">
        ⏳ Автобой загружается
      </div>
    </section>
  </main>

  <script>
    const telegram = window.Telegram.WebApp;
    const API_URL = "https://ryzhikai.com/rpg-api";

    telegram.ready();
    telegram.expand();

    const elements = {
      level: document.getElementById("level"),
      gold: document.getElementById("gold"),
      power: document.getElementById("power"),
      stage: document.getElementById("stage"),
      heroName: document.getElementById("heroName"),
      heroIcon: document.getElementById("heroIcon"),
      enemyIcon: document.getElementById("enemyIcon"),
      enemyHp: document.getElementById("enemyHp"),
      enemyMaxHp: document.getElementById("enemyMaxHp"),
      enemyHpBar: document.getElementById("enemyHpBar"),
      killsInStage: document.getElementById("killsInStage"),
      damage: document.getElementById("damage"),
      attackSpeed: document.getElementById("attackSpeed"),
      totalKills: document.getElementById("totalKills"),
      message: document.getElementById("message"),
      autoBattleStatus: document.getElementById("autoBattleStatus")
    };

    let player = null;
    let battleTimer = null;
    let battleRunning = false;
    let requestInProgress = false;

    async function apiRequest(path, method = "GET") {
      const response = await fetch(`${API_URL}${path}`, {
        method,
        headers: {
          "X-Telegram-Init-Data": telegram.initData
        }
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.detail || "Ошибка сервера");
      }

      return data;
    }

    function updateScreen() {
      if (!player) {
        return;
      }

      elements.level.textContent = player.level;
      elements.gold.textContent = player.gold;
      elements.power.textContent = player.power;
      elements.stage.textContent = player.stage;
      elements.heroName.textContent = player.first_name || "Герой";
      elements.enemyHp.textContent = player.enemy_hp;
      elements.enemyMaxHp.textContent = player.enemy_max_hp;
      elements.killsInStage.textContent = player.kills_in_stage;
      elements.damage.textContent = player.damage;
      elements.attackSpeed.textContent =
        Number(player.attack_speed).toFixed(2);
      elements.totalKills.textContent = player.total_kills;

      const hpPercent = Math.max(
        0,
        Math.min(
          100,
          (player.enemy_hp / player.enemy_max_hp) * 100
        )
      );

      elements.enemyHpBar.style.width = `${hpPercent}%`;

      const attackDelay = Number(player.attack_interval || 1);

      elements.autoBattleStatus.textContent =
        `⚔️ Автобой: удар каждые ${attackDelay.toFixed(2)} сек.`;
    }

    function animateAttack() {
      elements.heroIcon.classList.add("hero-attacking");

      setTimeout(() => {
        elements.heroIcon.classList.remove("hero-attacking");
        elements.enemyIcon.classList.add("enemy-hit");
      }, 100);

      setTimeout(() => {
        elements.enemyIcon.classList.remove("enemy-hit");
      }, 250);
    }

    function stopAutoBattle() {
      battleRunning = false;

      if (battleTimer) {
        clearTimeout(battleTimer);
        battleTimer = null;
      }

      elements.autoBattleStatus.textContent = "⏸ Автобой остановлен";
    }

    function scheduleNextAttack(delaySeconds) {
      if (!battleRunning) {
        return;
      }

      const safeDelay = Math.max(0.1, Number(delaySeconds || 1));

      battleTimer = setTimeout(
        performAttack,
        safeDelay * 1000
      );
    }

    async function performAttack() {
      if (!battleRunning || requestInProgress) {
        return;
      }

      requestInProgress = true;

      try {
        const result = await apiRequest("/attack", "POST");

        player = result;
        updateScreen();

        if (result.attacked) {
          animateAttack();
          elements.message.classList.remove("error");
          elements.message.textContent = result.message;

          if (
            result.enemy_defeated &&
            telegram.HapticFeedback
          ) {
            telegram.HapticFeedback.notificationOccurred(
              "success"
            );
          } else if (telegram.HapticFeedback) {
            telegram.HapticFeedback.impactOccurred("light");
          }

          scheduleNextAttack(result.attack_interval);
        } else {
          scheduleNextAttack(
            result.retry_after || result.attack_interval
          );
        }
      } catch (error) {
        elements.message.classList.add("error");
        elements.message.textContent = `❌ ${error.message}`;

        scheduleNextAttack(3);
      } finally {
        requestInProgress = false;
      }
    }

    async function startGame() {
      try {
        if (!telegram.initData) {
          throw new Error(
            "Открой игру через кнопку Mini App внутри Telegram"
          );
        }

        player = await apiRequest("/player");
        updateScreen();

        elements.message.classList.remove("error");
        elements.message.textContent = "✅ Герой вступил в бой";

        battleRunning = true;
        scheduleNextAttack(0.5);
      } catch (error) {
        elements.message.classList.add("error");
        elements.message.textContent = `❌ ${error.message}`;
        elements.autoBattleStatus.textContent =
          "Автобой не запущен";
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopAutoBattle();
        return;
      }

      if (player && !battleRunning) {
        battleRunning = true;
        elements.message.textContent = "⚔️ Автобой продолжен";
        scheduleNextAttack(0.3);
      }
    });

    window.addEventListener("pagehide", stopAutoBattle);
    window.addEventListener("beforeunload", stopAutoBattle);

    startGame();
  </script>
</body>
</html>
